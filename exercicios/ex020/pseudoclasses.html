<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        div{
            display:inline-block;
            background-color: rgb(247, 178, 211);
            border: 2px solid rgb(122, 9, 46);
            text-align: center;
            height: 200px;
            width: 200px;
        }

        div:hover{
            background-color: rgb(185, 131, 236);
            border:2px solid rgb(75, 5, 109)
        }
    </style>
</head>
<body>
    <div id="d1">01</div>
    <div id="d2">02</div>
    <div id="d3">03</div>
</body>
</html>
