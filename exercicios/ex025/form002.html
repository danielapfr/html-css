<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulario</h1>

    <form action="xadastro.php" method="post">
        <p>
            <label for="iusu">Usuario: </label>
            <input type="text" name="usu" id="iusu" required size="30" placeholder="nome do usuario" autocomplete="username">
        </p>
        <p>
            <label for="iso">Senha: </label>
            <input type="password" name="sen" id="isen" required minlength="8" size="8" placeholder="senha" autocomplete="new-password">
        </p>
        <p>
           <input type="submit" value="Enviar">
           <input type="reset"  value="Limpar">
        </p>
    </form>
</body>
</html>
